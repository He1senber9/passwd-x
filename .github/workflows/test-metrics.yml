name: test-metrics

on:
  push:
    branches: [master] # 徽章反映默认/发布主干
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: 运行测试并生成徽章数据
        id: tests
        run: |
          cargo test --workspace > /tmp/test.log 2>&1 || true
          PASSED=$(grep -oE '[0-9]+ passed' /tmp/test.log | awk '{s+=$1} END{print s+0}')
          FAILED=$(grep -oE '[0-9]+ failed' /tmp/test.log | awk '{s+=$1} END{print s+0}')
          TOTAL=$((PASSED + FAILED))
          if [ "$TOTAL" -eq 0 ]; then
            MESSAGE="无测试结果"
            COLOR="red"
          elif [ "$FAILED" -eq 0 ]; then
            MESSAGE="$PASSED/$TOTAL 通过"
            COLOR="brightgreen"
          else
            MESSAGE="$PASSED/$TOTAL 通过"
            COLOR="red"
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "message=$MESSAGE" >> "$GITHUB_OUTPUT"
          echo "color=$COLOR" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/badge
          printf '{\n  "schemaVersion": 1,\n  "label": "Rust 测试",\n  "message": "%s",\n  "color": "%s"\n}\n' "$MESSAGE" "$COLOR" > /tmp/badge/badge.json
      - name: 发布到 gh-badges 分支
        run: |
          git config user.name "passwd-x badge bot"
          git config user.email "badge-bot@users.noreply.github.com"
          git fetch origin gh-badges || true
          if git rev-parse --verify origin/gh-badges >/dev/null 2>&1; then
            git checkout gh-badges 2>/dev/null || git checkout -b gh-badges origin/gh-badges
          else
            git checkout --orphan gh-badges
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp /tmp/badge/badge.json .
          git add badge.json
          git commit -m "chore(badges): 更新 Rust 测试通过率（${{ steps.tests.outputs.passed }} 通过 / ${{ steps.tests.outputs.failed }} 失败）" || echo "徽章无变化"
          git push origin gh-badges
