name: ci

on:
  pull_request:
  push:
    branches: [master, dev]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 格式校验
        run: cargo fmt --all -- --check
      - name: Clippy 校验
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust 测试
        run: cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: 安装依赖
        run: npm ci
        working-directory: app
      - name: 前端格式校验
        run: npm run format:check
        working-directory: app
      - name: 前端构建
        run: npm run build
        working-directory: app

  branch-naming:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: 校验分支命名
        run: |
          HEAD="${{ github.head_ref }}"
          if [[ "$HEAD" =~ ^(feature|hotfix)-[a-z0-9]+(-[a-z0-9]+){1,3}$ ]] || [[ "$HEAD" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "分支命名合规：$HEAD"
          else
            echo "分支命名不符合约定：$HEAD（应为 feature-<2-4词>、hotfix-<2-4词> 或 release/<semver>）"
            exit 1
          fi
