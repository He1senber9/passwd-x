name: release

on:
  schedule:
    # 北京时间每周三 10:00 = UTC 02:00
    - cron: "0 2 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 计算版本并更新 changelog
        id: bump
        run: |
          VERSION=$(node scripts/release-prepare.mjs)
          if [ "$VERSION" = "NOCHANGE" ]; then
            echo "无新提交，跳过发布。"
            echo "version=NOCHANGE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: 创建 release 分支并提交版本号与 changelog
        if: steps.bump.outputs.version != 'NOCHANGE'
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          git config user.name "passwd-x release bot"
          git config user.email "release-bot@users.noreply.github.com"
          git checkout -b "release/$VERSION"
          git add Cargo.toml Cargo.lock app/package.json CHANGELOG.md
          git commit -m "chore(release): 发布 v$VERSION"
          git push origin "release/$VERSION"
      - name: 打 tag 并创建 GitHub Release
        if: steps.bump.outputs.version != 'NOCHANGE'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "passwd-x v$VERSION" --notes "$(cat CHANGELOG.md)"
      - name: 创建 PR 到 master
        if: steps.bump.outputs.version != 'NOCHANGE'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          gh pr create --base master --head "release/$VERSION" \
            --title "release: v$VERSION" \
            --body "自动发布 v$VERSION；changelog 见 CHANGELOG.md。签名构建与上传由 release-updater 工作流在 Release 发布后执行。"
