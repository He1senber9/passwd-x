name: release

on:
  schedule:
    # 北京时间每周三 10:00 = UTC 02:00
    - cron: "0 2 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      notes: ${{ steps.bump.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 计算版本并更新 changelog
        id: bump
        run: |
          VERSION=$(node scripts/release-prepare.mjs)
          if [ "$VERSION" = "NOCHANGE" ]; then
            echo "无新提交，跳过发布。"
            echo "version=NOCHANGE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<EOF"
            cat CHANGELOG.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: 创建 release 分支并打 tag
        if: steps.bump.outputs.version != 'NOCHANGE'
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          git config user.name "passwd-x release bot"
          git config user.email "release-bot@users.noreply.github.com"
          git checkout -b "release/$VERSION"
          git add Cargo.toml Cargo.lock app/package.json CHANGELOG.md
          git commit -m "chore(release): 发布 v$VERSION"
          git push origin "release/$VERSION"
          git tag "v$VERSION"
          git push origin "v$VERSION"
      - name: 创建 PR 到 master
        if: steps.bump.outputs.version != 'NOCHANGE'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base master --head "release/${{ steps.bump.outputs.version }}" \
            --title "release: v${{ steps.bump.outputs.version }}" \
            --body "自动发布：版本 v${{ steps.bump.outputs.version }}。changelog 见 CHANGELOG.md，产物由构建任务上传到 GitHub Release。"

  build-publish:
    needs: prepare
    if: needs.prepare.outputs.version != 'NOCHANGE'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "release/${{ needs.prepare.outputs.version }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: 安装前端依赖
        run: npm ci
        working-directory: app
      - name: 构建并发布到 GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "passwd-x v${{ needs.prepare.outputs.version }}"
          releaseBody: ${{ needs.prepare.outputs.notes }}
          releaseDraft: false
          prerelease: false
