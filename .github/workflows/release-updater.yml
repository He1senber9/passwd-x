name: release-updater

on:
  release:
    types: [published]
  repository_dispatch:
    types: [release-created]
  workflow_dispatch:
    inputs:
      tag:
        description: 需要构建上传的 Release tag（如 v0.4.0）
        required: true

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      releaseId: ${{ steps.info.outputs.releaseId }}
      tagName: ${{ steps.info.outputs.tagName }}
      releaseBody: ${{ steps.info.outputs.releaseBody }}
    steps:
      - name: 解析 Release 信息
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)
          echo "releaseId=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "tagName=$TAG" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .body > body.md
          {
            echo "releaseBody<<EOF"
            cat body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 安装前端依赖
        run: npm ci
        working-directory: app

      - name: 构建并上传到 GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          releaseId: ${{ needs.resolve.outputs.releaseId }}
          tagName: ${{ needs.resolve.outputs.tagName }}
          releaseBody: ${{ needs.resolve.outputs.releaseBody }}
          projectPath: app
          args: ${{ matrix.args }}
          updaterJsonPreferNsis: true
